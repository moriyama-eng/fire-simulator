<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation — FIRE Monte Carlo Simulator</title>
    <meta name="description" content="Documentation for the FIRE Monte Carlo Simulator: guides, reference, and technical explanations.">

    <!-- KaTeX CSS (patch-pinned) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <!-- Existing app styles (dark mode tokens) -->
    <link rel="stylesheet" href="css/style.css?v=2.7.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           docs.html – scoped styles
        ============================================================ */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            margin: 0;
            min-height: 100vh;
        }

        /* ---- Top bar ---- */
        #docs-topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.5rem;
            background: rgba(15,17,23,0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(99,102,241,0.2);
        }
        #docs-topbar .brand {
            font-size: 1rem;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }
        #docs-topbar .back-link {
            font-size: 0.8rem;
            color: #94a3b8;
            text-decoration: none;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.2s;
        }
        #docs-topbar .back-link:hover { color: #a78bfa; }
        #menu-toggle {
            display: none;
            background: none;
            border: 1px solid rgba(99,102,241,0.4);
            border-radius: 6px;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.35rem 0.6rem;
            font-size: 1rem;
            transition: border-color 0.2s, color 0.2s;
        }
        #menu-toggle:hover { border-color: #a78bfa; color: #a78bfa; }

        /* ---- Layout ---- */
        #docs-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: calc(100vh - 53px);
        }

        /* ---- Sidebar ---- */
        #docs-sidebar {
            position: sticky;
            top: 53px;
            height: calc(100vh - 53px);
            overflow-y: auto;
            padding: 1.5rem 0;
            border-right: 1px solid rgba(99,102,241,0.15);
            background: #0c0e14;
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }
        #docs-sidebar::-webkit-scrollbar { width: 4px; }
        #docs-sidebar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        .nav-category {
            padding: 0 1rem 1rem;
        }
        .nav-category-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #64748b;
            padding: 0 0.5rem;
            margin-bottom: 0.4rem;
        }
        .nav-link {
            display: block;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.82rem;
            color: #94a3b8;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
            cursor: pointer;
        }
        .nav-link:hover { background: rgba(99,102,241,0.1); color: #c7d2fe; }
        .nav-link.active { background: rgba(99,102,241,0.18); color: #a5b4fc; font-weight: 600; }

        /* TOC section inside sidebar */
        #toc-section {
            border-top: 1px solid rgba(99,102,241,0.15);
            margin-top: 0.5rem;
            padding-top: 0.75rem;
        }
        .toc-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #64748b;
            padding: 0 1.5rem;
            margin-bottom: 0.4rem;
        }
        .toc-link {
            display: block;
            padding: 0.28rem 1.5rem;
            font-size: 0.78rem;
            color: #64748b;
            text-decoration: none;
            transition: color 0.15s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .toc-link:hover { color: #a5b4fc; }
        .toc-link.toc-h3 { padding-left: 2.25rem; font-size: 0.74rem; }

        /* ---- Main content ---- */
        #docs-main {
            padding: 2.5rem 3rem 4rem;
            max-width: 860px;
        }

        /* Prose styles */
        #docs-content h1 { font-size: 1.75rem; font-weight: 800; color: #e2e8f0; margin: 0 0 1.25rem; line-height: 1.2; }
        #docs-content h2 { font-size: 1.2rem; font-weight: 700; color: #c7d2fe; margin: 2rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid rgba(99,102,241,0.2); }
        #docs-content h3 { font-size: 1rem; font-weight: 600; color: #a5b4fc; margin: 1.5rem 0 0.5rem; }
        #docs-content h4 { font-size: 0.9rem; font-weight: 600; color: #94a3b8; margin: 1.25rem 0 0.4rem; }
        #docs-content p { line-height: 1.75; color: #cbd5e1; margin: 0.6rem 0 0.8rem; }
        #docs-content a { color: #818cf8; text-decoration: underline; text-underline-offset: 2px; transition: color 0.15s; }
        #docs-content a:hover { color: #a5b4fc; }
        #docs-content strong { color: #e2e8f0; }
        #docs-content code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.83em;
            background: rgba(99,102,241,0.12);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 4px;
            padding: 0.1em 0.35em;
            color: #c7d2fe;
        }
        #docs-content pre {
            background: #0d1117;
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            overflow-x: auto;
            margin: 0.75rem 0 1rem;
        }
        #docs-content pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 0.82rem;
            color: #a5b4fc;
        }
        #docs-content table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 0.75rem 0 1.25rem;
        }
        #docs-content th {
            background: rgba(99,102,241,0.12);
            color: #a5b4fc;
            padding: 0.5rem 0.75rem;
            text-align: left;
            border: 1px solid rgba(99,102,241,0.2);
            font-weight: 600;
            font-size: 0.8rem;
        }
        #docs-content td {
            padding: 0.45rem 0.75rem;
            border: 1px solid rgba(99,102,241,0.12);
            color: #cbd5e1;
            vertical-align: top;
        }
        #docs-content tr:nth-child(even) td { background: rgba(99,102,241,0.04); }
        #docs-content blockquote {
            border-left: 3px solid #818cf8;
            margin: 0.75rem 0;
            padding: 0.5rem 1rem;
            background: rgba(99,102,241,0.06);
            border-radius: 0 6px 6px 0;
        }
        #docs-content blockquote p { color: #94a3b8; margin: 0; }
        #docs-content ul, #docs-content ol { padding-left: 1.5rem; color: #cbd5e1; line-height: 1.75; }
        #docs-content li { margin: 0.2rem 0; }
        #docs-content hr { border: none; border-top: 1px solid rgba(99,102,241,0.15); margin: 1.5rem 0; }


        /* Not-found card */
        #not-found-card {
            margin: 3rem auto;
            max-width: 480px;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 10px;
            padding: 2rem;
        }
        #not-found-card h2 { color: #f87171; border: none; }
        #not-found-card p { color: #94a3b8; }
        #not-found-card a { color: #818cf8; }

        /* Loading indicator */
        #docs-loading {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #64748b;
            font-size: 0.85rem;
            padding: 3rem 0;
        }
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(99,102,241,0.3);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Mobile: max-width 768px ---- */
        @media (max-width: 768px) {
            #docs-layout { grid-template-columns: 1fr; }
            #docs-sidebar {
                position: fixed;
                top: 53px;
                left: 0;
                width: 260px;
                height: calc(100vh - 53px);
                z-index: 200;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }
            #docs-sidebar.open { transform: translateX(0); }
            #docs-main { padding: 1.5rem 1.25rem 3rem; max-width: 100%; }
            #menu-toggle { display: block; }
            #sidebar-overlay {
                display: none;
                position: fixed;
                inset: 53px 0 0 0;
                background: rgba(0,0,0,0.5);
                z-index: 199;
            }
            #sidebar-overlay.open { display: block; }
        }
        @media (min-width: 769px) {
            #sidebar-overlay { display: none !important; }
        }
    </style>
</head>

<body class="dark">

<!-- Top bar -->
<header id="docs-topbar">
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <a class="brand app-title" href="docs.html">FIRE Monte Carlo Simulator Docs</a>
    <a class="back-link" href="index.html">← Back to Simulator</a>
</header>

<!-- Sidebar overlay (mobile) -->
<div id="sidebar-overlay"></div>

<div id="docs-layout">
    <!-- Sidebar -->
    <nav id="docs-sidebar" role="navigation" aria-label="Documentation navigation">
        <div id="nav-list"><!-- populated by JS --></div>
        <div id="toc-section"></div>
    </nav>

    <!-- Main content -->
    <main id="docs-main">
        <div id="docs-loading">
            <div class="spinner"></div>
            Loading…
        </div>
        <article id="docs-content" style="display:none;"></article>
        <div id="not-found-card" style="display:none;">
            <h2>Page not found</h2>
            <p>The requested documentation page does not exist or is not publicly available.</p>
            <p><a href="docs.html?doc=guide/getting-started">← Back to Getting Started</a></p>
        </div>
    </main>
</div>

<!-- CDN scripts (patch-pinned, jsdelivr) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script>
// ============================================================
// docs.html — documentation viewer
// ============================================================

(function () {
    'use strict';

    // ---- State ----
    let manifest = null;

    // ---- DOM refs ----
    const sidebar     = document.getElementById('docs-sidebar');
    const navList     = document.getElementById('nav-list');
    const tocSection  = document.getElementById('toc-section');
    const loadingEl   = document.getElementById('docs-loading');
    const contentEl   = document.getElementById('docs-content');
    const notFoundEl  = document.getElementById('not-found-card');
    const menuToggle  = document.getElementById('menu-toggle');
    const overlay     = document.getElementById('sidebar-overlay');

    // ---- Mobile sidebar toggle ----
    menuToggle.addEventListener('click', () => {
        const isOpen = sidebar.classList.toggle('open');
        overlay.classList.toggle('open', isOpen);
        menuToggle.setAttribute('aria-expanded', String(isOpen));
    });
    overlay.addEventListener('click', closeSidebar);
    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
    }

    // ---- Parse ?doc=<category>/<name> ----
    function getDocParam() {
        const raw = new URLSearchParams(location.search).get('doc') || '';
        return raw;
    }

    // ---- Security: validate against manifest whitelist ----
    function isAllowedDoc(category, name, man) {
        // Block internal/ always
        if (category === 'internal') return false;
        // Block path traversal
        if (category.includes('..') || name.includes('..') || category.includes('/') || name.includes('/')) return false;
        const cat = man.categories.find(c => c.id === category);
        if (!cat) return false;
        return cat.docs.some(d => d.id === name);
    }

    // ---- Build doc URL ----
    function docUrl(category, name) {
        return `docs/${category}/${name}.md`;
    }

    // ---- URL rewriting for inter-doc links ----
    function rewriteLinks(container, currentCategory) {
        const base = new URL(`docs/${currentCategory}/`, location.href);
        container.querySelectorAll('a[href]').forEach(a => {
            const rawHref = a.getAttribute('href');
            // Skip: absolute, protocol-relative, external http(s), anchor-only
            if (!rawHref) return;
            if (rawHref.startsWith('http://') || rawHref.startsWith('https://')) return;
            if (rawHref.startsWith('//')) return;
            if (rawHref.startsWith('/')) return;
            if (rawHref.startsWith('#')) return;

            let resolved;
            try {
                resolved = new URL(rawHref, base);
            } catch (e) { return; }

            const resPath = resolved.pathname;
            const docsBase = new URL('docs/', location.href).pathname;

            if (resPath.startsWith(docsBase) && resPath.endsWith('.md')) {
                // docs-relative .md link → rewrite to ?doc=category/name
                const rel = resPath.slice(docsBase.length).replace(/\.md$/, '');
                const parts = rel.split('/');
                if (parts.length === 2) {
                    const [cat, nm] = parts;
                    const hash = resolved.hash || '';
                    a.setAttribute('href', `docs.html?doc=${cat}/${nm}${hash}`);
                    a.addEventListener('click', e => {
                        e.preventDefault();
                        const target = `${cat}/${nm}`;
                        history.pushState(null, '', `docs.html?doc=${target}${hash}`);
                        loadDoc(target);
                        closeSidebar();
                    });
                    return;
                }
            }

            // Non-docs link (e.g. ../README.md) → normalize to root-relative
            if (resPath.endsWith('.md')) {
                // Keep as relative link from root (e.g. ./README.md#anchor)
                const rootRel = './' + resPath.slice(new URL('./', location.href).pathname.length);
                a.setAttribute('href', rootRel + (resolved.hash || ''));
            }
        });
    }

    // ---- Render TOC from h2/h3 ----
    function buildToc(container) {
        const headings = Array.from(container.querySelectorAll('h2, h3'));
        if (headings.length === 0) { tocSection.innerHTML = ''; return; }

        let html = '<div class="toc-label">On this page</div>';
        headings.forEach(h => {
            const level = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
            const id = h.id || '';
            const text = h.textContent;
            html += `<a class="toc-link ${level}" href="#${id}">${text}</a>`;
        });
        tocSection.innerHTML = html;

        // TOC links scroll into view
        tocSection.querySelectorAll('a').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                const target = document.getElementById(a.getAttribute('href').slice(1));
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                closeSidebar();
            });
        });
    }

    // ---- Anchor IDs for headings (GitHub-style) ----
    function slugify(text) {
        return text.toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .trim()
            .replace(/\s+/g, '-');
    }

    function addHeadingIds(container) {
        container.querySelectorAll('h1, h2, h3, h4').forEach(h => {
            if (!h.id) h.id = slugify(h.textContent);
        });
    }

    // ---- Render math ----
    function renderMath(container) {
        if (typeof window.renderMathInElement !== 'function') return;
        try {
            window.renderMathInElement(container, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '\\(', right: '\\)', display: false }
                ],
                throwOnError: false
            });
        } catch (e) {
            // Graceful degradation: raw text already visible
        }

        // Mark math elements as non-translatable
        container.querySelectorAll('.katex, .katex-display').forEach(el => {
            el.setAttribute('translate', 'no');
            el.classList.add('notranslate');
            // Also mark immediate parent
            if (el.parentElement) {
                el.parentElement.setAttribute('translate', 'no');
                el.parentElement.classList.add('notranslate');
            }
        });
    }

    // ---- Load and render a document ----
    async function loadDoc(docPath) {
        // Show loading
        contentEl.style.display = 'none';
        notFoundEl.style.display = 'none';
        loadingEl.style.display = 'flex';
        contentEl.innerHTML = '';
        tocSection.innerHTML = '';

        // Parse path
        const parts = docPath.split('/');
        if (parts.length !== 2) { showNotFound(); return; }
        const [category, name] = parts;

        // Validate
        if (!manifest || !isAllowedDoc(category, name, manifest)) {
            showNotFound();
            return;
        }

        // Update nav active state
        document.querySelectorAll('.nav-link').forEach(el => {
            el.classList.toggle('active', el.dataset.doc === docPath);
        });

        // Fetch markdown
        let md;
        try {
            const res = await fetch(docUrl(category, name));
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            md = await res.text();
        } catch (e) {
            showNotFound();
            return;
        }

        // Parse with marked (graceful fallback)
        let html;
        if (typeof marked !== 'undefined' && marked.parse) {
            try { html = marked.parse(md); }
            catch (e) { html = `<pre>${escapeHtml(md)}</pre>`; }
        } else {
            html = `<pre>${escapeHtml(md)}</pre>`;
        }

        // Inject into DOM
        contentEl.innerHTML = html;
        addHeadingIds(contentEl);
        rewriteLinks(contentEl, category);
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';

        // KaTeX render
        renderMath(contentEl);

        // TOC
        buildToc(contentEl);

        // Update page title
        const h1 = contentEl.querySelector('h1');
        document.title = (h1 ? h1.textContent + ' — ' : '') + 'FIRE Monte Carlo Simulator Docs';

        // Scroll to anchor if present
        const hash = location.hash;
        if (hash) {
            setTimeout(() => {
                const el = document.querySelector(hash);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 80);
        } else {
            window.scrollTo({ top: 0 });
        }
    }

    function showNotFound() {
        loadingEl.style.display = 'none';
        contentEl.style.display = 'none';
        notFoundEl.style.display = 'block';
        document.title = 'Page Not Found — FIRE Monte Carlo Simulator Docs';
    }

    function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ---- Build nav from manifest ----
    function buildNav(man) {
        let html = '';
        man.categories.forEach(cat => {
            html += `<div class="nav-category">`;
            html += `<div class="nav-category-label">${escapeHtml(cat.label)}</div>`;
            cat.docs.forEach(doc => {
                const docId = `${cat.id}/${doc.id}`;
                html += `<a class="nav-link" data-doc="${docId}" href="docs.html?doc=${docId}">${escapeHtml(doc.title)}</a>`;
            });
            html += `</div>`;
        });
        navList.innerHTML = html;

        // SPA navigation
        navList.querySelectorAll('.nav-link').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                const docId = a.dataset.doc;
                history.pushState(null, '', `docs.html?doc=${docId}`);
                loadDoc(docId);
                closeSidebar();
            });
        });
    }

    // ---- Init ----
    async function init() {
        // Load manifest
        try {
            const res = await fetch('docs/manifest.json');
            manifest = await res.json();
        } catch (e) {
            loadingEl.innerHTML = '<span style="color:#f87171">Failed to load documentation manifest.</span>';
            return;
        }

        buildNav(manifest);

        // Determine which doc to load
        let docParam = getDocParam();
        if (!docParam || docParam === '') docParam = 'guide/getting-started';

        loadDoc(docParam);
    }

    // Handle browser back/forward
    window.addEventListener('popstate', () => {
        const docParam = getDocParam() || 'guide/getting-started';
        loadDoc(docParam);
    });

    init();
})();
</script>

</body>
</html>
