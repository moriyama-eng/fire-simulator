<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-version" content="3.0.2">
    <title>Documentation — FIRE Monte Carlo Simulator</title>
    <meta name="description" content="Documentation for the FIRE Monte Carlo Simulator: guides, reference, and technical explanations.">
    <link rel="icon" href="data:,">

    <!-- KaTeX CSS (patch-pinned) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">

    <!-- Font Preloads (Self-Hosted Inter) -->
    <link rel="preload" as="font" type="font/woff2" href="css/fonts/Inter-400.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="css/fonts/Inter-700.woff2" crossorigin>

    <style>
        /* ============================================================
           docs.html – scoped styles
        ============================================================ */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            margin: 0;
            min-height: 100vh;
        }

        /* ---- Top bar ---- */
        #docs-topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.5rem;
            background: rgba(15,17,23,0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(99,102,241,0.2);
        }
        #docs-topbar .brand {
            font-size: 1rem;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }
        #docs-topbar .back-link {
            font-size: 0.8rem;
            color: #94a3b8;
            text-decoration: none;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.2s;
        }
        #docs-topbar .back-link:hover { color: #a78bfa; }
        #menu-toggle {
            display: none;
            background: none;
            border: 1px solid rgba(99,102,241,0.4);
            border-radius: 6px;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.35rem 0.6rem;
            font-size: 1rem;
            transition: border-color 0.2s, color 0.2s;
        }
        #menu-toggle:hover { border-color: #a78bfa; color: #a78bfa; }

        /* ---- Layout ---- */
        #docs-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: calc(100vh - 53px);
        }

        /* ---- Sidebar ---- */
        #docs-sidebar {
            position: sticky;
            top: 53px;
            height: calc(100vh - 53px);
            overflow-y: auto;
            padding: 1.5rem 0;
            border-right: 1px solid rgba(99,102,241,0.15);
            background: #0c0e14;
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }
        #docs-sidebar::-webkit-scrollbar { width: 4px; }
        #docs-sidebar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        .nav-category {
            padding: 0 1rem 1rem;
        }
        .nav-category-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #64748b;
            padding: 0 0.5rem;
            margin-bottom: 0.4rem;
        }
        .nav-link {
            display: block;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.82rem;
            color: #94a3b8;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
            cursor: pointer;
        }
        .nav-link:hover { background: rgba(99,102,241,0.1); color: #c7d2fe; }
        .nav-link.active { background: rgba(99,102,241,0.18); color: #a5b4fc; font-weight: 600; }

        /* TOC section inside sidebar */
        #toc-section {
            border-top: 1px solid rgba(99,102,241,0.15);
            margin-top: 0.5rem;
            padding-top: 0.75rem;
        }
        .toc-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #64748b;
            padding: 0 1.5rem;
            margin-bottom: 0.4rem;
        }
        .toc-link {
            display: block;
            padding: 0.28rem 1.5rem;
            font-size: 0.78rem;
            color: #64748b;
            text-decoration: none;
            transition: color 0.15s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .toc-link:hover { color: #a5b4fc; }
        .toc-link.toc-h3 { padding-left: 2.25rem; font-size: 0.74rem; }

        /* ---- Main content ---- */
        #docs-main {
            padding: 2.5rem 3rem 4rem;
            max-width: 860px;
        }

        /* Prose styles */
        #docs-content h1 { font-size: 1.75rem; font-weight: 800; color: #e2e8f0; margin: 0 0 1.25rem; line-height: 1.2; }
        #docs-content h2 { font-size: 1.2rem; font-weight: 700; color: #c7d2fe; margin: 2rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid rgba(99,102,241,0.2); }
        #docs-content h3 { font-size: 1rem; font-weight: 600; color: #a5b4fc; margin: 1.5rem 0 0.5rem; }
        #docs-content h4 { font-size: 0.9rem; font-weight: 600; color: #94a3b8; margin: 1.25rem 0 0.4rem; }
        #docs-content p { line-height: 1.75; color: #cbd5e1; margin: 0.6rem 0 0.8rem; }
        #docs-content a { color: #818cf8; text-decoration: underline; text-underline-offset: 2px; transition: color 0.15s; }
        #docs-content a:hover { color: #a5b4fc; }
        #docs-content strong { color: #e2e8f0; }
        #docs-content code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.83em;
            background: rgba(99,102,241,0.12);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 4px;
            padding: 0.1em 0.35em;
            color: #c7d2fe;
        }
        #docs-content pre {
            background: #0d1117;
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            overflow-x: auto;
            margin: 0.75rem 0 1rem;
        }
        #docs-content pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 0.82rem;
            color: #a5b4fc;
        }
        #docs-content table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 0.75rem 0 1.25rem;
        }
        #docs-content th {
            background: rgba(99,102,241,0.12);
            color: #a5b4fc;
            padding: 0.5rem 0.75rem;
            text-align: left;
            border: 1px solid rgba(99,102,241,0.2);
            font-weight: 600;
            font-size: 0.8rem;
        }
        #docs-content td {
            padding: 0.45rem 0.75rem;
            border: 1px solid rgba(99,102,241,0.12);
            color: #cbd5e1;
            vertical-align: top;
        }
        #docs-content tr:nth-child(even) td { background: rgba(99,102,241,0.04); }
        #docs-content blockquote {
            border-left: 3px solid #818cf8;
            margin: 0.75rem 0;
            padding: 0.5rem 1rem;
            background: rgba(99,102,241,0.06);
            border-radius: 0 6px 6px 0;
        }
        #docs-content blockquote p { color: #94a3b8; margin: 0; }
        #docs-content ul, #docs-content ol { padding-left: 1.5rem; color: #cbd5e1; line-height: 1.75; }
        #docs-content li { margin: 0.2rem 0; }
        #docs-content hr { border: none; border-top: 1px solid rgba(99,102,241,0.15); margin: 1.5rem 0; }

        /* Not-found card */
        #not-found-card {
            margin: 3rem auto;
            max-width: 480px;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 10px;
            padding: 2rem;
        }
        #not-found-card h2 { color: #f87171; border: none; }
        #not-found-card p { color: #94a3b8; }
        #not-found-card a { color: #818cf8; }

        /* Loading indicator */
        #docs-loading {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #64748b;
            font-size: 0.85rem;
            padding: 3rem 0;
        }
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(99,102,241,0.3);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Mobile: max-width 768px ---- */
        @media (max-width: 768px) {
            #docs-layout { grid-template-columns: 1fr; }
            #docs-sidebar {
                position: fixed;
                top: 53px;
                left: 0;
                width: 260px;
                height: calc(100vh - 53px);
                z-index: 200;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }
            #docs-sidebar.open { transform: translateX(0); }
            #docs-main { padding: 1.5rem 1.25rem 3rem; max-width: 100%; }
            #menu-toggle { display: block; }
            #sidebar-overlay {
                display: none;
                position: fixed;
                inset: 53px 0 0 0;
                background: rgba(0,0,0,0.5);
                z-index: 199;
            }
            #sidebar-overlay.open { display: block; }
        }
        @media (min-width: 769px) {
            #sidebar-overlay { display: none !important; }
        }
    </style>
</head>

<body class="dark">

<!-- Top bar -->
<header id="docs-topbar">
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <a class="brand app-title" href="docs.html">FIRE Monte Carlo Simulator Docs</a>
    <a class="back-link" href="index.html">← Back to Simulator</a>
</header>

<!-- Sidebar overlay (mobile) -->
<div id="sidebar-overlay"></div>

<div id="docs-layout">
    <!-- Sidebar -->
    <nav id="docs-sidebar" role="navigation" aria-label="Documentation navigation">
        <div id="nav-list"><!-- populated by JS --></div>
        <div id="toc-section"></div>
    </nav>

    <!-- Main content -->
    <main id="docs-main">
        <div id="docs-loading">
            <div class="spinner"></div>
            Loading…
        </div>
        <article id="docs-content" style="display:none;"></article>
        <div id="not-found-card" style="display:none;">
            <h2>Page not found</h2>
            <p>The requested documentation page does not exist or is not publicly available.</p>
            <p><a href="docs.html?doc=guide/overview">← Back to Overview</a></p>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
<script type="module" src="/src/docs-app.ts"></script>
</body>
</html>
