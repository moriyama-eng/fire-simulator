name: Deploy to GitHub Pages

on:
  push:
    branches: [main, release/v3.0.0]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (using: node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (using: node24)
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:css
      - run: git diff --exit-code -- css/tailwind.css
      - run: npm run build:client
      - run: node scripts/verify-cdn-sri.mjs
      - run: node scripts/smoke-subpath-server.mjs
      - run: npm run build:cli
      - run: npm test
      - run: node scripts/assert-client-bundle.mjs
      - run: node scripts/assert-build-artifacts.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0 (using: node24)
        with:
          path: dist/client

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5 (using: node24)
